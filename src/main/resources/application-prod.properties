# ===================================================================
# 服务器配置
# ===================================================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/}

# ===================================================================
# 数据库连接配置 (MySQL)
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prod_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# 生产环境建议开启连接池监控及调整大小（以 HikariCP 为例）
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================================
# Redis 连接配置
# ===================================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:0}
# 生产环境可增加超时和连接池配置
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX:20}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:10}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:5}

# ===================================================================
# JWT 配置
# ===================================================================
# 生产环境必须使用独立、高强度的密钥（至少 256 位）
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:1800}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800}

# ===================================================================
# 邮件服务设置（生产环境使用专用邮箱）
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.port=${MAIL_PORT:465}
spring.mail.default-encoding=UTF-8
spring.mail.protocol=smtps

# ===================================================================
# 日志与调试配置
# ===================================================================
logging.level.cn.caldm.www=info
logging.level.org.apache.ibatis=info
logging.level.root=warn
