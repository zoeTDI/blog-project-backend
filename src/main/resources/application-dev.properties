server.port=18080
server.servlet.context-path=/api

# ===================================================================
# 数据库连接配置 (MySQL)
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/website_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=123456

# ===================================================================
# 日志与调试配置
# ===================================================================
logging.file.name=logs/${spring.application.name}.log
logging.level.cn.caldm.www=debug
logging.level.org.apache.ibatis=debug
spring.output.ansi.enabled=ALWAYS

# ===================================================================
# JWT 配置
# ===================================================================
jwt.secret=my_super_secret_key_which_should_be_long_enough_for_security_2026
jwt.expiration=1800
jwt.refresh-expiration=604800

# ===================================================================
# Redis 连接配置
# ===================================================================
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=123456
spring.data.redis.database=0
