server.port=18080
server.servlet.context-path=/api

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# ===================================================================
# 数据库连接配置 (MySQL)
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/website_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=123456

# ===================================================================
# MyBatis-Plus 基础配置
# ===================================================================
mybatis-plus.type-aliases-package=cn.caldm.www.infra.domain
mybatis-plus.configuration.map-underscore-to-camel-case=true

# ===================================================================
# 日志与调试配置
# ===================================================================
logging.level.cn.caldm.www.infra.mapper=debug