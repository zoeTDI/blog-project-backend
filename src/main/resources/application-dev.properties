server.port=18080
server.servlet.context-path=/api

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# ===================================================================
# 数据库连接配置 (MySQL)
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/website_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=123456

# ===================================================================
# MyBatis-Plus 基础配置
# ===================================================================
mybatis-plus.type-aliases-package=cn.caldm.www.infra.domain
mybatis-plus.configuration.map-underscore-to-camel-case=true

# ===================================================================
# 日志与调试配置
# ===================================================================
logging.level.cn.caldm.www.infra.mapper=debug
# ===================================================================
# JWT 配置
# ===================================================================
jwt.secret=my_super_secret_key_which_should_be_long_enough_for_security_2026
jwt.expiration=1800
jwt.refresh-expiration=604800
# ===================================================================
# Redis 连接配置
# ===================================================================
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=123456
spring.data.redis.database=0
# ===================================================================
# 邮件服务设置
# ===================================================================
spring.mail.host: smtp.qq.com
spring.mail.username: xxx@qq.com
spring.mail.password: code
spring.mail.port: 465
spring.mail.default-encoding: UTF-8
spring.mail.protocol: smtps
spring.mail.properties."mail.smtp.connectiontimeout": 5000
spring.mail.properties."mail.smtp.timeout": 3000
spring.mail.properties."mail.smtp.writetimeout": 5000
spring.mail.properties."mail.smtp.auth": true
spring.mail.properties."mail.smtp.starttls.enable": true
spring.mail.properties."mail.smtp.starttls.required": true
spring.mail.properties."mail.smtp.ssl.enable"=true
